name: build-apollo-miui-kernel

# 为红米 K30S（apollo / M2007J3SC，MIUI 12.5.5 / Android 11 / 内核 4.19.113）
# 构建开启 PID/IPC/UTS namespace 的内核，供 Droidspaces 使用。
# 产物：Image（替换 boot 里的 kernel）、.config、Module.symvers、全部 .ko（打包成 Magisk 模块）

on:
  workflow_dispatch:
    inputs:
      paranoid_net_off:
        description: '把 CONFIG_ANDROID_PARANOID_NETWORK 关掉（容器内没网时才勾）'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: 取出本仓库文件
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses5 \
            device-tree-compiler cpio python3 rsync zip unzip wget git \
            liblz4-tool zlib1g-dev

      - name: 拉取小米开源内核（apollo-q-oss，源码基线 4.19.81）
        run: git clone --depth=1 -b apollo-q-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

      - name: 拉取工具链（clang r383902 + gcc 4.9 预编译）
        run: |
          git clone --depth=1 -b 10 https://github.com/AOSP-10/prebuilts_clang_host_linux-x86_clang-r383902.git clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32
          chmod +x clang/bin/* || true
          ./clang/bin/clang --version

      - name: 打上 Droidspaces 的 non-GKI 补丁（失败不阻断）
        run: |
          curl -sL -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/ravindu644/Droidspaces-OSS/contents/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch" -o 01.patch
          curl -sL -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/ravindu644/Droidspaces-OSS/contents/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch" -o 02.patch
          head -3 01.patch; head -3 02.patch
          cd kernel
          patch -p1 --forward < ../01.patch || echo "::warning::01 补丁未应用（4.19 上可能不适用），继续"
          patch -p1 --forward < ../02.patch || echo "::warning::02 补丁未应用（4.19 上可能不适用），继续"

      - name: 生成 defconfig（真机配置 + delta）
        run: |
          cp k30s_config.txt kernel/arch/arm64/configs/vendor/apollo_miui_defconfig
          cat defconfig.delta >> kernel/arch/arm64/configs/vendor/apollo_miui_defconfig
          if [ "${{ inputs.paranoid_net_off }}" = "true" ]; then
            echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> kernel/arch/arm64/configs/vendor/apollo_miui_defconfig
            echo "已关闭 ANDROID_PARANOID_NETWORK"
          fi
          tail -20 kernel/arch/arm64/configs/vendor/apollo_miui_defconfig

      - name: 修补老内核在新工具链上的已知问题
        run: |
          set -e
          # 1) 小米只放出了 Android 10 的 apollo 源码（4.19.81），真机是 4.19.113。
          #    把 SUBLEVEL 顶到 113，让 UTS_RELEASE 与原厂模块 vermagic 逐字一致：
          #    4.19.113-perf-g62242b28117e
          sed -i 's/^SUBLEVEL = 81$/SUBLEVEL = 113/' kernel/Makefile
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' kernel/Makefile

          # 2) gcc 10+ 默认 -fno-common，导致 dtc 的 yylloc 重复定义
          #    (multiple definition of `yylloc')。改成 extern 声明。
          sed -i 's/^YYLTYPE yylloc;$/extern YYLTYPE yylloc;/' kernel/scripts/dtc/dtc-lexer.l
          grep -n 'yylloc;' kernel/scripts/dtc/dtc-lexer.l | head -3

      - name: 编译
        run: |
          set -x
          # 全程写入 build.log，方便失败诊断；不要用 head 截断管道（会触发 SIGPIPE）
          : > build.log
          echo "=== 工作目录 ===" | tee -a build.log
          pwd | tee -a build.log

          echo "=== 工具链检查 ===" | tee -a build.log
          ls -l clang/bin/clang | tee -a build.log || true
          ls -l gcc64/bin/aarch64-linux-android-gcc | tee -a build.log || true
          ls -l gcc32/bin/arm-linux-androideabi-gcc | tee -a build.log || true

          export PATH="$PWD/clang/bin:$PATH"
          clang --version > /tmp/clangver.txt 2>&1 || true
          sed -n '1,3p' /tmp/clangver.txt | tee -a build.log
          make --version > /tmp/mkver.txt 2>&1 || true
          sed -n '1p' /tmp/mkver.txt | tee -a build.log
          nproc | tee -a build.log

          mkdir -p out
          COMMON="ARCH=arm64 SUBARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$PWD/gcc64/bin/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=$PWD/gcc32/bin/arm-linux-androideabi- \
            HOSTCFLAGS=-fcommon"

          echo "=== 阶段1: defconfig ===" | tee -a build.log
          set +e
          make -C kernel O=$PWD/out $COMMON vendor/apollo_miui_defconfig >> build.log 2>&1
          RC1=$?
          echo "RC1(defconfig)=$RC1"
          if [ "$RC1" != "0" ]; then
            echo "::error title=defconfig失败::$RC1"
            exit 1
          fi

          echo "=== 阶段2: make -j$(nproc) ===" | tee -a build.log
          make -C kernel O=$PWD/out $COMMON -j$(nproc) >> build.log 2>&1
          RC2=$?
          echo "RC2(build)=$RC2"
          exit $RC2

      - name: 失败诊断
        if: failure()
        run: |
          echo "===== 关键配置是否生效 ====="
          grep -E '^CONFIG_(PID_NS|IPC_NS|SYSVIPC|LOCALVERSION|LOCALVERSION_AUTO|DEVTMPFS)=' out/.config 2>/dev/null || echo "(out/.config 不存在，说明 defconfig 阶段就失败了)"

      - name: 失败诊断-日志回显
        if: failure()
        run: |
          # 把关键错误行写成 error 标注，公开仓库可被外部接口读到（无需登录下载日志）
          if [ ! -f build.log ]; then
            echo "::error title=no-build.log::build.log 不存在，说明在 make 之前就退出了"
            exit 0
          fi
          echo "===== 有效错误行 ====="
          grep -nE '(\*\*\*|error:|Error [0-9]|No such file|undefined reference|unrecognized|cannot find)' build.log | tail -n 8 | while IFS= read -r line; do
            clean=$(printf '%s' "$line" | tr -d '\r' | cut -c1-280)
            echo "::error title=err::$clean"
          done
          echo "===== 最后 8 行上下文 ====="
          tail -n 8 build.log | while IFS= read -r line; do
            clean=$(printf '%s' "$line" | tr -d '\r' | cut -c1-280)
            echo "::error title=tail::$clean"
          done

      - name: 校验产物
        run: |
          echo "===== utsrelease（必须等于 4.19.113-perf-g62242b28117e）====="
          cat out/include/generated/utsrelease.h
          echo "===== 关键配置 ====="
          grep -E '^CONFIG_(PID_NS|IPC_NS|SYSVIPC|POSIX_MQUEUE|DEVTMPFS|USER_NS|NET_NS|UTS_NS|SMP|PREEMPT|MODVERSIONS|MODULE_UNLOAD|MACVLAN|CFS_BANDWIDTH|CGROUP_PIDS)=' out/.config || true
          echo "===== CRC 比对（基准 module_layout=0xeacc760d wake_up_process=0xbbe31357）====="
          grep -E 'module_layout|wake_up_process|printk|kfree|kmalloc_caches' out/Module.symvers || true
          echo "===== 内核镜像 ====="
          ls -l out/arch/arm64/boot/Image

      - name: 打包全部 .ko 成 Magisk 覆盖模块（备用方案）
        if: always()
        run: |
          set -e
          mkdir -p magisk/system/vendor/lib/modules
          find out -name '*.ko' -exec cp {} magisk/system/vendor/lib/modules/ \; || true
          COUNT=$(ls magisk/system/vendor/lib/modules/*.ko 2>/dev/null | wc -l)
          echo "收集到 $COUNT 个模块"
          cat > magisk/module.prop <<'EOF'
          id=apollo_miui_droidspaces_modules
          name=K30S Droidspaces 内核模块
          version=v1
          versionCode=1
          author=local-build
          description=用自编内核配套的 /vendor/lib/modules 覆盖原厂模块（仅在原厂模块 CRC 不匹配时使用）
          EOF
          cd magisk && zip -r ../modules-magisk.zip . || true

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apollo-miui-kernel
          path: |
            out/arch/arm64/boot/Image
            out/.config
            out/Module.symvers
            out/include/generated/utsrelease.h
            build.log
            modules-magisk.zip
          if-no-files-found: warn
